name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: portfolio-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for packaging and browser checks
        run: npx playwright-core install --with-deps chromium
      - name: Build, verify and package
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e "import {chromium} from 'playwright-core'; process.stdout.write(chromium.executablePath())")"
          npm run release
          npm test
      - name: Update published branch
        run: |
          publish_dir="$(mktemp -d)"
          authorization_header="$(git config --get http.https://github.com/.extraheader)"
          git -c "http.https://github.com/.extraheader=$authorization_header" clone --quiet --single-branch --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"
          rsync -a --delete --exclude=.git dist/ "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" config user.name github-actions[bot]
          git -C "$publish_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Publish portfolio from ${GITHUB_SHA}"
            git -C "$publish_dir" -c "http.https://github.com/.extraheader=$authorization_header" push origin gh-pages
          fi
      # GITHUB_TOKEN pushes do not automatically trigger a Pages build.
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
